<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050" role="img" aria-labelledby="title desc">
  <title id="title">Inkcast deployment on Vercel</title>
  <desc id="desc">Sequence of one film on the hosted deployment: the studio Function records the job in Blob, holds a POST /run to the inkcast-render container for up to 800 seconds, the container writes progress and the finished film to the private Blob store, and the browser streams progress and the video through studio routes. Below: the job.json state machine with its three-minute staleness rule, and the isolation and limits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #475569; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; fill: #475569; }
      .lbl { font-size: 12px; fill: #1e293b; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .on-dark { fill: #ffffff; }
      .on-dark-dim { fill: #d4d4d8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .msg { stroke: #334155; stroke-width: 1.6; fill: none; }
      .reply { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .life { stroke: #cbd5e1; stroke-width: 2; }
      .risk { fill: #b91c1c; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1050" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <text class="title" x="32" y="42">Inkcast on Vercel — two projects, one Blob store</text>
  <text class="sub" x="32" y="64">One film, end to end. Progress travels through Blob because the request that starts a film, the one that streams it and the container that renders it are three instances.</text>

  <!-- lifeline headers -->
  <rect x="30" y="90" width="160" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="h" x="110" y="118" text-anchor="middle">Browser</text>
  <text class="s" x="110" y="138" text-anchor="middle">studio UI · EventSource</text>

  <rect x="290" y="90" width="260" height="66" rx="10" fill="#0a0a0a"/>
  <text class="h on-dark" x="420" y="114" text-anchor="middle">inkcast · studio</text>
  <text class="s on-dark-dim" x="420" y="132" text-anchor="middle">project root apps/web · inkcast.video</text>
  <text class="s on-dark-dim" x="420" y="148" text-anchor="middle">Node Functions · Standard 2 GB / 1 vCPU</text>

  <rect x="610" y="90" width="220" height="66" rx="10" fill="#0a0a0a"/>
  <text class="h on-dark" x="720" y="114" text-anchor="middle">Vercel Blob · private</text>
  <text class="s on-dark-dim" x="720" y="132" text-anchor="middle">inkcast-media</text>
  <text class="s on-dark-dim" x="720" y="148" text-anchor="middle">connected to both projects</text>

  <rect x="900" y="90" width="270" height="66" rx="10" fill="#0a0a0a"/>
  <text class="h on-dark" x="1035" y="114" text-anchor="middle">inkcast-render · container</text>
  <text class="s on-dark-dim" x="1035" y="132" text-anchor="middle">project root . · Dockerfile.vercel</text>
  <text class="s on-dark-dim" x="1035" y="148" text-anchor="middle">Performance 4 GB / 2 vCPU · max 800 s</text>

  <!-- lifelines -->
  <line class="life" x1="110" y1="156" x2="110" y2="770"/>
  <line class="life" x1="420" y1="156" x2="420" y2="770"/>
  <line class="life" x1="720" y1="156" x2="720" y2="770"/>
  <line class="life" x1="1035" y1="156" x2="1035" y2="770"/>

  <!-- activations -->
  <rect x="413" y="280" width="14" height="372" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="1028" y="282" width="14" height="340" rx="3" fill="#0a0a0a"/>
  <text class="s" x="404" y="300" text-anchor="end">after() keeps this</text>
  <text class="s" x="404" y="316" text-anchor="end">invocation alive ≤ 800 s</text>

  <!-- 1 -->
  <line class="msg" x1="110" y1="190" x2="411" y2="190" marker-end="url(#arrow)"/>
  <text class="lbl" x="128" y="183">① POST /api/generate · Clerk session</text>
  <!-- 2 -->
  <line class="msg" x1="420" y1="222" x2="718" y2="222" marker-end="url(#arrow)"/>
  <text class="lbl" x="438" y="215">② meta.json + job.json {queued}</text>
  <!-- 3 -->
  <line class="reply" x1="420" y1="254" x2="112" y2="254" marker-end="url(#arrow-reply)"/>
  <text class="lbl" x="128" y="247">③ 202 { projectId }</text>
  <!-- 4 -->
  <line class="msg" x1="427" y1="292" x2="1026" y2="292" marker-end="url(#arrow)"/>
  <text class="lbl" x="440" y="285">④ POST /run · Bearer INKCAST_RENDER_TOKEN · providerEnv · isolated</text>
  <text class="lbl" x="742" y="310">busy instance ⇒ 503 ⇒ studio retries ≤ 3 min</text>
  <!-- 5 -->
  <line class="msg" x1="1028" y1="340" x2="722" y2="340" marker-end="url(#arrow)"/>
  <text class="lbl" x="1018" y="333" text-anchor="end">⑤ job.json {running}</text>
  <!-- 6 self -->
  <path class="msg" d="M1042,362 H1100 V392 H1044" marker-end="url(#arrow)"/>
  <text class="lbl" x="1108" y="374">⑥ cast()</text>
  <text class="s" x="1108" y="390">in /tmp</text>
  <!-- 7 -->
  <line class="msg" x1="1028" y1="418" x2="722" y2="418" marker-end="url(#arrow)"/>
  <text class="lbl" x="1018" y="411" text-anchor="end">⑦ job.json progress (≥ 5 s apart) · heartbeat 20 s</text>
  <!-- 8 -->
  <line class="msg" x1="110" y1="450" x2="411" y2="450" marker-end="url(#arrow)"/>
  <text class="lbl" x="128" y="443">⑧ GET /api/generate/[id]/stream</text>
  <!-- 9 -->
  <line class="msg" x1="427" y1="482" x2="718" y2="482" marker-end="url(#arrow)"/>
  <text class="lbl" x="438" y="475">⑨ poll job.json every 2 s · settleStale()</text>
  <!-- 10 -->
  <line class="reply" x1="413" y1="514" x2="112" y2="514" marker-end="url(#arrow-reply)"/>
  <text class="lbl" x="128" y="507">⑩ SSE progress (≤ 270 s, then reconnect)</text>
  <!-- 11 -->
  <line class="msg" x1="1028" y1="552" x2="722" y2="552" marker-end="url(#arrow)"/>
  <text class="lbl" x="1018" y="545" text-anchor="end">⑪ out.mp4 · thumbnail · storyboard · captions</text>
  <!-- 12 -->
  <line class="msg" x1="1028" y1="584" x2="722" y2="584" marker-end="url(#arrow)"/>
  <text class="lbl" x="1018" y="577" text-anchor="end">⑫ job.json {done | error}</text>
  <!-- 13 -->
  <line class="reply" x1="1028" y1="616" x2="429" y2="616" marker-end="url(#arrow-reply)"/>
  <text class="lbl" x="1018" y="609" text-anchor="end">⑬ terminal NDJSON line · /tmp wiped</text>
  <!-- 14 -->
  <line class="msg" x1="427" y1="646" x2="718" y2="646" marker-end="url(#arrow)"/>
  <text class="lbl" x="438" y="639">⑭ final meta.json</text>
  <!-- 15 -->
  <line class="msg" x1="110" y1="690" x2="418" y2="690" marker-end="url(#arrow)"/>
  <text class="lbl" x="128" y="683">⑮ GET /api/media/[id]/out.mp4</text>
  <!-- 16 -->
  <line class="msg" x1="420" y1="722" x2="718" y2="722" marker-end="url(#arrow)"/>
  <text class="lbl" x="438" y="715">⑯ owner / share check → stream blob</text>
  <!-- 17 -->
  <line class="reply" x1="420" y1="754" x2="112" y2="754" marker-end="url(#arrow-reply)"/>
  <text class="lbl" x="128" y="747">⑰ video/mp4 (Range forwarded)</text>

  <!-- panel A: job lifecycle -->
  <rect x="30" y="796" width="560" height="226" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="h" x="48" y="822">job.json lifecycle</text>
  <text class="s mono" x="200" y="822">packages/cloud/src/job.ts</text>

  <rect x="48" y="846" width="100" height="36" rx="18" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="b" x="98" y="869" text-anchor="middle">queued</text>
  <rect x="210" y="846" width="110" height="36" rx="18" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="b" x="265" y="869" text-anchor="middle">running</text>
  <rect x="440" y="836" width="110" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="b" x="495" y="858" text-anchor="middle">done</text>
  <rect x="440" y="896" width="110" height="34" rx="17" fill="#fef2f2" stroke="#b91c1c"/>
  <text class="b" x="495" y="918" text-anchor="middle">error</text>

  <line class="msg" x1="148" y1="864" x2="208" y2="864" marker-end="url(#arrow)"/>
  <line class="msg" x1="320" y1="858" x2="438" y2="852" marker-end="url(#arrow)"/>
  <text class="lbl" x="378" y="846" text-anchor="middle">result</text>
  <line class="msg" x1="320" y1="872" x2="438" y2="908" marker-end="url(#arrow)"/>
  <text class="lbl" x="350" y="904" text-anchor="middle">StageError</text>
  <path d="M265,882 V922 H438" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-risk)"/>
  <text class="s risk" x="276" y="940">stale: no write for 3 min</text>
  <text class="s" x="48" y="964">Readers (stream, library) apply settleStale(): queued/running with</text>
  <text class="s" x="48" y="980"><tspan class="mono">updatedAt</tspan> older than <tspan class="mono">STALE_AFTER_MS</tspan> = 3 min is reported as an error.</text>
  <text class="s risk" x="48" y="1002">Risk: heartbeats are timers on the render event loop; one Kokoro call</text>
  <text class="s risk" x="48" y="1016">blocks it 10–21 s. Fine on 2 vCPU; a starved host can cross 3 min.</text>

  <!-- panel B: isolation & limits -->
  <rect x="610" y="796" width="560" height="226" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="h" x="628" y="822">Isolation and limits</text>
  <text class="s" x="628" y="850">• One film per instance: a busy instance answers 503; Fluid compute scales out.</text>
  <text class="s" x="628" y="874">• providerEnv is resolved by the studio per film. isolated (accounts on) ⇒</text>
  <text class="s" x="640" y="890">nothing from the container's own environment reaches the film.</text>
  <text class="s" x="628" y="914">• Keys never written to Blob or logs (installRedaction, withSecretRedaction).</text>
  <text class="s" x="628" y="938">• Frames, wavs and caches live in /tmp/inkcast and are deleted every run.</text>
  <text class="s" x="628" y="962">• 800 s ceiling on both sides: the studio's after() and the container.</text>
  <text class="s" x="628" y="986">• INKCAST_BLOB_PREFIX keeps preview films out of production's library.</text>
  <text class="s" x="628" y="1010">• /api/media refuses meta.json and job.json; films are never public URLs.</text>
</svg>
