<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 200" width="130" height="200">
  <!--
    In profile, with the far arm and far leg omitted: two nearly parallel limbs read
    as mud at this size, one reads as a person. The stool comes last and light — it is
    context, and without something under the hips the figure only looks like it is
    falling over. It sits *below* the thigh rather than across it, because a seat line
    crossing the leg reads as a strike-through instead of as furniture.
  -->
